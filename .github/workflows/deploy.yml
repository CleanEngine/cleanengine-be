name: CI/CD Deploy and Start services

run-name: Deploy to ECR and Start services by ${{github.actor}}

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_TO_ASSUME}}
          aws-region: ${{secrets.AWS_REGION}}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push image to ECR
        run: |
          docker build -t ${{secrets.AWS_ORGANIZATION}}/backend .
          docker tag ${{secrets.AWS_ORGANIZATION}}/backend:latest ${{secrets.AWS_ECR_BACKEND_REPO}}:latest
          docker push ${{secrets.AWS_ECR_BACKEND_REPO}}:latest

  start-services:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Connect to cloud server and run Docker commands
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{secrets.BACKEND_HOST}}
          username: ${{secrets.CLOUD_USERNAME}}
          key: ${{secrets.CLOUD_SECRET_KEY}}
          port: ${{secrets.CLOUD_PORT}}
          script: |
            cd ~
            sudo sh docker_login.sh
            sudo docker stop springboot
            sudo docker rm -f springboot
            sudo docker pull ${{secrets.AWS_ECR_BACKEND_REPO}}:latest
            sudo docker run -d \
              --name springboot \
              --restart on-failure \
              -p 8080:8080 \
              -e KAKAO_CLIENT_ID='${{secrets.KAKAO_CLIENT_ID}}' \
              -e MARIADB_USER='${{secrets.MARIADB_USER}}' \
              -e MARIADB_PASSWORD='${{secrets.MARIADB_PASSWORD}}' \
              -e MARIADB_DATABASE='${{secrets.MARIADB_DATABASE}}' \
              -e JWT_SECRET='${{secrets.JWT_SECRET}}' \
              -v /etc/localtime:/etc/localtime:ro \
              -v /usr/share/zoneinfo/Asia/Seoul:/etc/timezone:ro \
              -v /home/ubuntu/logs/springboot:/app/logs \
              ${{secrets.AWS_ECR_BACKEND_REPO}}:latest
