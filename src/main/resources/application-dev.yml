common-db-properties : &common-db-properties
  jdbc-url: jdbc:h2:mem:testdb
  driver-class-name: org.h2.Driver
  username: sa
  password:

spring:
  config:
    import: optional:file:./local.properties
    main:
      <<: *common-db-properties
      pool-name: main-datasource-pool
      maximum-pool-size: 15
      minimum-idle: 15
    trade:
      <<: *common-db-properties
      pool-name: trade-datasource-pool
      maximum-pool-size: 3
      minimum-idle: 3

  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
    cookie:
      secure: false

frontend:
  url: "http://localhost:5173/callback"
