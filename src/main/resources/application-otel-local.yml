receivers:
  otlp:
    protocols:
      http:
        endpoint: "localhost:4318"

exporters:
  jaeger:
    endpoint: "localhost:14250"
    insecure: true
  prometheus:
    endpoint: "localhost:9090"

processors:
  batch:
    timeout: 5s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]