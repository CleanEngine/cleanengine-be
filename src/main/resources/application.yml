spring:
  application:
    name: coin
  web:
    resources:
      add-mappings: true
  profiles:
    active: dev
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
    allowed-origins: http://localhost:63342,http://localhost:63343,http://localhost:8080,http://localhost:5500,http://localhost:5173,http://localhost:3000,https://investfuture.my,http://172.16.24.113:8080
    endpoints:
      public:
        paths: /api/login,/api/asset,/api/oauth2,/api/healthcheck,/api/coin/realtime,/api/coin/min,/api/minute-ohlc,/api/swagger,/h2-console,/actuator,/api/test,/api/coin/prev

      websocket:
        paths: /api/coin/min,/api/coin/realtime,/api/coin/orderbook,/api/coin/prev
  jwt:
    secret: ${JWT_SECRET}
  jackson:
    time-zone: Asia/Seoul
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

springdoc:
    api-docs:
      path: /api/swagger/v3/api-docs
    swagger-ui:
      path: /api/swagger/swagger-ui.html
      url: /api/swagger/v3/api-docs

server:
  forward-headers-strategy: native

bot-handler:
  fixed-rate: 1000 #  5초마다 실행
  cron : "0 0 0 * * *" # 매일 자정마다 호가
  order-level : 1,2,3,4,5 #오더북 단계 설정 - 주문량 증가
